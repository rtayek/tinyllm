[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllm"
version = "0.0.1"
description = "Tiny byte-level GPT in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ray" }]
dependencies = [
  "torch>=2.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pyright>=1.1.0",
]

[project.scripts]
tinyllm-train = "llm.Main:main"
tinyllm-infer = "llm.infer:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["llm"]
omit = [
  "src/llm/DataBottleneckProfiler.py",
  "src/llm/checkGPU.py",
  "src/llm/make_tender_buttons_dataset.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
