[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllm"
version = "0.0.1"
description = "Tiny byte-level GPT in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ray" }]
dependencies = [
  "torch>=2.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pyright>=1.1.0",
]

[project.scripts]
tinyllm-train = "llm.train_app:main"
tinyllm-infer = "llm.infer:main"
tinyllm-prepare-corpora = "llm.corpus:main"
tinyllm-eval-per-book = "llm.research.eval_per_book:main"
tinyllm-destruction-experiments = "llm.research.destruction_experiments:main"
tinyllm-ngram-baseline = "llm.research.ngram_baseline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["llm"]
omit = [
  "src/llm/research/destruction_experiments.py",
  "src/llm/research/eval_per_book.py",
  "src/llm/research/ngram_baseline.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
